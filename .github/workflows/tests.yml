name: Tests

on:
  push:
  pull_request:

jobs:
  validate-package-php52:
    name: PHP 5.2
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run package validation under PHP 5.2
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            --entrypoint /usr/bin/php \
            ghcr.io/clagomess/docker-php-5.2:latest \
            tests/validate-package.php
